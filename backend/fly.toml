# fly.toml – megmarad helyi Docker Compose-hoz, Render-en nem használt
# Ha mégis Fly.io-t szeretnél: add hozzá a DATABASE_URL-t secrets-ként
app = "testflow-api"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_URLS        = "http://+:8080"

[http_service]
  internal_port      = 8080
  force_https        = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"
